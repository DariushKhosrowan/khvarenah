[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khvarenah"
version = "0.1.9"
description = "Khvarenah (Khovarenah, خوَرنه) — ancient Persian royal glory; a Cloudflare-worker VLESS VPN console in your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dariush Khosrowan", email = "dariush@khosrowan.ir" }]
keywords = ["vpn", "proxy", "vless", "cloudflare", "workers", "iran", "persian", "khvarenah", "khovarenah"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Security",
]
dependencies = [
  "PySide6>=6.5",
  "textual>=3.0",
  "requests",
  "pyperclip",
  "Pillow",
]

[project.scripts]
khvarenah = "khvarenah.main:entrypoint"
khvarenah-tui = "khvarenah.tui:main"
khvarenah-gui = "khvarenah.gui:main"

[tool.setuptools]
packages = ["khvarenah"]

[tool.setuptools.package-data]
khvarenah = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["."]
