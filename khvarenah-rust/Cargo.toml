[package]
name = "khvarenah"
version = "0.2.0"
edition = "2021"
description = "Khvarenah — Cloudflare-worker VLESS VPN console (Rust rewrite)"
license = "MIT"
authors = ["Dariush Khosrowan <dariush@khosrowan.ir>"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
uuid = { version = "1.29.1", features = ["v4", "serde"] }
chrono = "0.4.45"
base64 = "0.23.1"
url = "2.5.8"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "blocking", "multipart", "rustls-tls"] }
regex = "1.13.1"
once_cell = "1.21.4"
tempfile = "3"
rand = "0.8"
eframe = "0.29"
egui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[features]
default = []
# Full TLS-handshake verification during clean-IP health checks (requires the
# rustls plumbing on top of TCP; plain TCP reachability is used otherwise).
health-tls = []

[dev-dependencies]
httpmock = "0.9.0"
tempfile = "3"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
strip = true
