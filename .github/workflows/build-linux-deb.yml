name: Build Linux .deb (PyInstaller)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the built .deb to (manual dispatch)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target release tag
        id: tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${GITHUB_REF_NAME}" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot dpkg-dev

      - name: Create venv + install build/runtime deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install pyinstaller textual requests pyperclip pillow

      - name: Build .deb (PyInstaller onefile)
        run: bash build-deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: khvarenah-deb
          path: build/khvarenah_*.deb
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: build/khvarenah_*.deb
