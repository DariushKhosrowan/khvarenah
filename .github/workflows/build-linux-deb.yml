name: Build Linux .deb (PyInstaller)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot dpkg-dev

      - name: Create venv + install build/runtime deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install pyinstaller textual requests pyperclip pillow

      - name: Build .deb (PyInstaller onefile)
        run: bash build-deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: khvarenah-deb
          path: build/khvarenah_*.deb
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/khvarenah_*.deb
