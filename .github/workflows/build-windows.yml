name: Build Windows .exe (PyInstaller)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the built .exe to (manual dispatch)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target release tag
        id: tag
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF_NAME) {
            $TAG = $env:GITHUB_REF_NAME
          } else {
            $TAG = "${{ inputs.tag }}"
          }
          "tag=$TAG" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller textual requests pyperclip pillow

      - name: Build one-file exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name khvarenah `
            --collect-all textual `
            --add-data "khvarenah/assets/golden.png;khvarenah/assets" `
            launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: khvarenah-windows
          path: dist/khvarenah.exe
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/khvarenah.exe
