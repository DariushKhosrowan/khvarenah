name: Build Windows .exe (PyInstaller)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller textual requests pyperclip pillow

      - name: Build one-file exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name khvarenah `
            --collect-all textual `
            --add-data "khvarenah/assets/golden.png;khvarenah/assets" `
            launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: khvarenah-windows
          path: dist/khvarenah.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/khvarenah.exe
